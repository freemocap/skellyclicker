[project]
name = "skellyclicker-app"
version = "0.1.0"
description = "SkellyClicker playback application"
requires-python = ">=3.11,<3.13"
dependencies = ["freemocap", "skellytracker", "freemocap-sdk-server[bundle]", "fastapi>=0.115", "pyarrow>=18", "skellyforge", "trimesh>=4", "fast-simplification>=0.1", "pillow>=13.0.0"]

[project.scripts]
skellyclicker-playback = "skellyclicker_app.__main__:main"

[tool.uv]
override-dependencies = ["skellylogs", "skellypings", "numpy>=2.3.4,<2.5"]
exclude-dependencies = ["opencv-python"]

[tool.uv.sources]
freemocap = {path = "../../../project/repos/freemocap", editable = true}
skellytracker = {path = "../../../project/repos/skellytracker", editable = true}
skellyforge = {path = "../../../project/repos/skellyforge", editable = true}
skellycam = {path = "../../../project/repos/skellycam", editable = true}
skellypings = {path = "../../../project/repos/utils/skellypings", editable = true}
skellylogs = {path = "../../../project/repos/utils/skellylogs", editable = true}
freemocap-sdk-server = {path = "../../../project/repos/sdk/packages/server", editable = true}

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["skellyclicker_app"]
