[project]
name = "skellyclicker-zed-runtime"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "opencv-python-headless==4.12.0.88",
    "pyzed @ https://download.stereolabs.com/zedsdk/5.5/whl/win_amd64/pyzed-5.5-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
    "pyzed @ https://download.stereolabs.com/zedsdk/5.5/whl/linux_x86_64/pyzed-5.5-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
